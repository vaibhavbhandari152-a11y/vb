<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=900, height=1600" />
    <title>Ek Shaam Radheshyam — video</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 900px;
        height: 1600px;
        overflow: hidden;
        background: #000;
      }

      /* Same faces as the still (stills/poster.html) — see its notes for the fit. */
      @font-face {
        font-family: "Mukta";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/Mukta-700-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Open Sans Condensed";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/OpenSansCondensed-700-latin.woff2") format("woff2");
      }

      #root {
        position: relative;
        width: 900px;
        height: 1600px;
        overflow: hidden;
      }

      /* Everything that belongs to the poster lives in the camera, so one
         transform moves the image, the new text and the glints together.
         Origin top-left: x/y are then just the offset of the scaled poster,
         and staying inside [frame - 900·s, 0] keeps its edges off-screen. */
      #camera {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        height: 1600px;
        transform-origin: 0 0;
      }
      #plate,
      #panel-svg {
        position: absolute;
        inset: 0;
        width: 900px;
        height: 1600px;
      }
      .panel-text {
        font-weight: 700;
        fill: #320a03;
        text-rendering: geometricPrecision;
        filter: blur(0.35px);
      }
      .mukta {
        font-family: "Mukta";
      }
      #date {
        font-size: 54.5px;
      }
      #day {
        font-size: 47.5px;
      }
      #hour {
        font-size: 50px;
      }
      .addr {
        font-family: "Open Sans Condensed";
        font-size: 28.5px;
      }
      /* Revealed by the timeline; hidden in CSS so frame 0 is right. */
      .reveal {
        opacity: 0;
      }

      /* A gold glint across the text area of a panel. Each window sits inside
         the parchment, clear of the ornate frame, so the band only ever
         crosses parchment and ink. The band parks outside its window before
         and after each pass, hence data-layout-allow-overflow. */
      .glint-window {
        position: absolute;
        overflow: hidden;
        pointer-events: none;
      }
      .glint {
        position: absolute;
        top: -20%;
        left: -140px;
        width: 90px;
        height: 140%;
        transform: skewX(-18deg);
        background: linear-gradient(
          90deg,
          rgba(255, 236, 190, 0) 0%,
          rgba(255, 236, 190, 0.55) 50%,
          rgba(255, 236, 190, 0) 100%
        );
        mix-blend-mode: screen;
      }
      #glint-date {
        left: 598px;
        top: 628px;
        width: 284px;
        height: 300px;
      }
      #glint-addr {
        left: 606px;
        top: 1022px;
        width: 284px;
        height: 180px;
      }

      /* Screen-space sparkles, drifting up over the whole frame. */
      #sparkles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .spark {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 244, 214, 1) 0%,
          rgba(255, 198, 92, 0.75) 35%,
          rgba(255, 170, 60, 0) 70%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }

      #fade {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="900"
      data-height="1600"
    >
      <div id="camera" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <img id="plate" src="assets/plate.png" alt="" />

        <svg id="panel-svg" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg">
          <!-- Same placement as stills/poster.html; the address is split into one
               <text> per line so each can be revealed on its own beat. -->
          <text id="date" class="panel-text mukta reveal" x="746" y="675" text-anchor="middle">24.10.2026</text>
          <text id="day" class="panel-text mukta reveal" x="747" y="792" text-anchor="middle">Saturday</text>
          <!-- ":00 p.m" is baked into the plate, so the hour digit shows
               from the first frame alongside it. -->
          <text id="hour" class="panel-text mukta" x="668.5" y="912" text-anchor="middle">2</text>
          <text id="addr-1" class="panel-text addr reveal" x="750" y="1059" text-anchor="middle">Madhu Bhandari ke ghar</text>
          <text id="addr-2" class="panel-text addr reveal" x="750" y="1101" text-anchor="middle">Old Grain Market,</text>
          <text id="addr-3" class="panel-text addr reveal" x="750" y="1143" text-anchor="middle">Dera Road, Batala</text>
          <text id="addr-4" class="panel-text addr reveal" x="750" y="1185" text-anchor="middle">near State Bank of India</text>
        </svg>

        <div id="glint-date" class="glint-window"><div class="glint" data-layout-allow-overflow></div></div>
        <div id="glint-addr" class="glint-window"><div class="glint" data-layout-allow-overflow></div></div>
      </div>

      <div id="sparkles" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>

      <div id="fade" class="clip" data-start="0" data-duration="1.2" data-track-index="2"></div>

      <audio
        id="score"
        class="clip"
        src="assets/score.wav"
        data-start="0"
        data-duration="12"
        data-track-index="3"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- Camera ---------------------------------------------------------
      // Shots are (scale, x, y) with x in [900 - 900·s, 0], y in [1600 - 1600·s, 0].
      const SHOT = {
        title: { scale: 1.3, x: 0, y: 0 },
        titleEnd: { scale: 1.22, x: -70, y: -12 },
        // Date / Day / Time panel (poster y 548-950), window y 300-1189.
        details: { scale: 1.8, x: -720, y: -540 },
        detailsEnd: { scale: 1.84, x: -756, y: -570 },
        // Address panel (poster y 965-1260). Any shot centred on it would cut
        // through the singer's name plate just below (y 1370+), so the panel
        // sits low in frame instead: window bottom stays at y≈1330.
        venue: { scale: 1.8, x: -720, y: -794 },
        venueEnd: { scale: 1.83, x: -747, y: -834 },
        full: { scale: 1, x: 0, y: 0 },
      };
      tl.set("#camera", SHOT.title, 0);
      tl.to("#camera", { ...SHOT.titleEnd, duration: 2.5, ease: "sine.inOut" }, 0);
      tl.to("#camera", { ...SHOT.details, duration: 0.85, ease: "power2.inOut" }, 2.5);
      tl.to("#camera", { ...SHOT.detailsEnd, duration: 2.25, ease: "none" }, 3.35);
      tl.to("#camera", { ...SHOT.venue, duration: 0.85, ease: "power2.inOut" }, 5.6);
      tl.to("#camera", { ...SHOT.venueEnd, duration: 2.45, ease: "none" }, 6.45);
      tl.to("#camera", { ...SHOT.full, duration: 1.3, ease: "power2.inOut" }, 8.9);

      // ---- Fade in from black --------------------------------------------
      tl.to("#fade", { opacity: 0, duration: 1.0, ease: "power1.out" }, 0.1);

      // ---- Text reveals ---------------------------------------------------
      // Each line rises a few px into place as it fades up, landing on the
      // beat a bell strikes (see tools/make_audio.py).
      const reveal = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, at);
      reveal("#date", 3.4);
      reveal("#day", 3.85);
      ["#addr-1", "#addr-2", "#addr-3", "#addr-4"].forEach((sel, i) => reveal(sel, 6.45 + i * 0.3));

      // ---- Glints ---------------------------------------------------------
      const glint = (sel, at) =>
        tl.fromTo(`${sel} .glint`, { x: 0 }, { x: 520, duration: 0.9, ease: "power1.inOut", immediateRender: false }, at);
      glint("#glint-date", 4.55);
      glint("#glint-addr", 7.95);
      glint("#glint-date", 10.45);
      glint("#glint-addr", 10.75);

      // ---- Sparkles -------------------------------------------------------
      // Seeded PRNG so every render places them identically.
      let seed = 24102026;
      const rand = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
      const host = document.getElementById("sparkles");
      for (let i = 0; i < 26; i++) {
        const size = 6 + rand() * 12;
        const el = document.createElement("div");
        el.className = "spark";
        el.style.width = el.style.height = size + "px";
        el.style.left = rand() * 900 + "px";
        el.style.top = 200 + rand() * 1450 + "px";
        host.appendChild(el);

        const start = rand() * 6;
        const life = 3.5 + rand() * 3;
        const peak = 0.35 + rand() * 0.45;
        tl.fromTo(
          el,
          { y: 0, x: 0 },
          { y: -(140 + rand() * 220), x: (rand() - 0.5) * 60, duration: life, ease: "none" },
          start,
        );
        tl.to(el, { opacity: peak, duration: life * 0.3, ease: "sine.out" }, start);
        tl.to(el, { opacity: 0, duration: life * 0.5, ease: "sine.in" }, start + life * 0.5);
        // A second pass for most, so the air stays alive to the end.
        if (start + life < 12 - 3) {
          const again = start + life + rand() * 1.5;
          const life2 = Math.min(3.5 + rand() * 3, 12 - again);
          tl.set(el, { y: 0, x: 0 }, again);
          tl.to(el, { y: -(140 + rand() * 220), duration: life2, ease: "none" }, again);
          tl.to(el, { opacity: peak, duration: life2 * 0.3, ease: "sine.out" }, again);
          tl.to(el, { opacity: 0, duration: life2 * 0.5, ease: "sine.in" }, again + life2 * 0.5);
        }
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
