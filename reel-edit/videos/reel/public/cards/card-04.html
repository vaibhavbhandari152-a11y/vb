<div class="card" data-card-id="card-04">
  <style>
    .card[data-card-id="card-04"] .root {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 36px 32px 120px;
      font-family: 'Inter', sans-serif;
      color: #f1f1f1;
      background: transparent;
    }
    .card[data-card-id="card-04"] .kicker {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent-3);
      margin-bottom: 12px;
    }
    .card[data-card-id="card-04"] .flow-step {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .card[data-card-id="card-04"] .arrow {
      font-size: 36px;
      color: var(--accent-3);
      margin: 4px 0;
      text-shadow: 0 0 15px rgba(251,146,60,0.5);
    }
    .card[data-card-id="card-04"] .accent-line {
      width: 0; height: 4px;
      background: var(--accent-3);
      border-radius: 2px;
      margin-bottom: 16px;
    }
  </style>
  <div class="root">
    <div id="card-04-kicker" class="kicker"
      data-anim="slide-in" data-anim-at="0.2" data-anim-duration="0.4"
      data-anim-from="left" data-anim-distance="60">THE FLOW</div>
    <div id="card-04-line" class="accent-line"
      data-anim="grow-x" data-anim-at="0.4" data-anim-duration="0.5"
      data-anim-target-w="100"></div>
    <div id="card-04-step1" class="flow-step"
      data-anim="slide-in" data-anim-at="0.6" data-anim-duration="0.4"
      data-anim-from="bottom" data-anim-distance="40">WRITE A PROMPT</div>
    <div id="card-04-arrow1" class="arrow"
      data-anim="fade-in" data-anim-at="1.0" data-anim-duration="0.3">&#x2193;</div>
    <div id="card-04-step2" class="flow-step"
      data-anim="slide-in" data-anim-at="1.2" data-anim-duration="0.4"
      data-anim-from="bottom" data-anim-distance="40">SCRAPE THE INTERNET</div>
    <div id="card-04-arrow2" class="arrow"
      data-anim="fade-in" data-anim-at="1.6" data-anim-duration="0.3">&#x2193;</div>
    <div id="card-04-step3" class="flow-step"
      data-anim="slide-in" data-anim-at="1.8" data-anim-duration="0.4"
      data-anim-from="bottom" data-anim-distance="40">GET THE ARTIFACT</div>
  </div>
