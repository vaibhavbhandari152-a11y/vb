<div class="card" data-card-id="card-02">
  <style>
    .card[data-card-id="card-02"] .root {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 36px 32px 120px;
      font-family: 'Inter', sans-serif;
      color: #f1f1f1;
      background: transparent;
    }
    .card[data-card-id="card-02"] .kicker {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent-1);
      margin-bottom: 12px;
    }
    .card[data-card-id="card-02"] .number {
      font-size: 160px;
      font-weight: 700;
      line-height: 1.0;
      color: var(--accent-1);
      text-shadow: 0 4px 40px rgba(247,37,133,0.4);
    }
    .card[data-card-id="card-02"] .label {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .card[data-card-id="card-02"] .accent-line {
      width: 0; height: 4px;
      background: var(--accent-1);
      border-radius: 2px;
      margin: 16px 0;
    }
  </style>
  <div class="root">
    <div id="card-02-kicker" class="kicker"
      data-anim="slide-in" data-anim-at="0.2" data-anim-duration="0.4"
      data-anim-from="left" data-anim-distance="60">THE RESULT</div>
    <div id="card-02-number" class="number"
      data-anim="scale-pop" data-anim-at="0.4" data-anim-duration="0.5">1</div>
    <div id="card-02-line" class="accent-line"
      data-anim="grow-x" data-anim-at="0.6" data-anim-duration="0.5"
      data-anim-target-w="180"></div>
    <div id="card-02-label" class="label"
      data-anim="fade-in" data-anim-at="0.8" data-anim-duration="0.5">JOB OFFER</div>
  </div>
</div>
