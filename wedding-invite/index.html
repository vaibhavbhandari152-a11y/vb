<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360, height=640" />
    <title>Wedding Invitation — Ayush &amp; Bharti</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 360px;
        height: 640px;
        overflow: hidden;
        background: #000;
      }

      /* The exact script face the source card is set in. Self-hosted so the
         render is deterministic and needs no network. */
      @font-face {
        font-family: "Great Vibes";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/GreatVibes-latin.woff2") format("woff2");
      }

      /* Great Vibes draws its capital A as a closed loop with no apex, so at
         37px it reads as a lowercase a. Allura's A has a pointed apex and
         near-identical stroke weight and slant, so swapping just that one
         glyph makes the capital legible while "yush" and "Bharti" stay in the
         card's own face and keep matching the baked-in date and venue.
         Subset to U+0041 alone — 832 bytes. */
      @font-face {
        font-family: "Allura";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/Allura-A.woff2") format("woff2");
      }

      #root {
        position: relative;
        width: 360px;
        height: 640px;
        overflow: hidden;
      }

      /* Cover the two names baked into the source footage. The wreath interior
         behind them is pure #fff, so flat patches are seamless. Each rect is
         the largest one that still clears the wreath ring, the sprig on the
         left, and the "&" between the lines. */
      .patch {
        position: absolute;
        background: #fff;
      }
      #patch-1 {
        left: 144px;
        top: 144px;
        width: 91px;
        height: 41px;
      }
      #patch-2 {
        left: 144px;
        top: 206px;
        width: 110px;
        height: 35px;
      }

      /* SVG so each baseline is placed exactly (y IS the baseline) rather than
         inferred from line-box metrics, and text-anchor centres on the advance
         width the way the source's own layout does. */
      #name-svg {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 640px;
      }
      .script {
        font-family: "Great Vibes";
        font-size: 37px;
        fill: #2c2c26;
        text-rendering: geometricPrecision;
        /* Two jobs. The filter forces its own compositing layer, which drops
           Chromium's subpixel antialiasing — that put orange/blue fringes on
           the strokes where the source card's own type is neutral grey. The
           sub-pixel blur then softens the vector edges to sit with the
           surrounding artwork, which is soft from the source's own encode. */
        filter: blur(0.3px);
      }
      /* Letters start hidden in CSS so frame 0 is correct without a
         zero-duration set at timeline position 0. */
      .script .ltr {
        opacity: 0;
      }
      /* Only the initial. Everything else stays Great Vibes. */
      .cap-a {
        font-family: "Allura";
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.1333"
      data-width="360"
      data-height="640"
    >
      <video
        id="a-roll"
        class="clip"
        src="source.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="21.1333"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
      ></video>
      <audio
        id="a-roll-audio"
        class="clip"
        src="source.mp4"
        data-start="0"
        data-duration="21.1333"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <!-- Name swap. Enters at 12.9333s (frame 388): the scene-3 transition has
           cleared and the wreath interior is blank, two frames before the source
           starts typing the first name. -->
      <div
        id="name-swap"
        class="clip"
        data-start="12.9333"
        data-duration="8.2"
        data-track-index="1"
      >
        <div id="patch-1" class="patch"></div>
        <div id="patch-2" class="patch"></div>
        <svg id="name-svg" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg">
          <!-- x is each line's own centre in the source: the top name sits on
               the wreath's axis (fitted centre x=186), the lower one is nudged
               right, which is how the source staggers the pair around its
               off-centre "&". Keeping both preserves that composition. -->
          <text id="name-1" class="script" x="187.9" y="176" text-anchor="middle"><tspan
              class="ltr cap-a"
            >A</tspan><tspan class="ltr">y</tspan><tspan class="ltr">u</tspan><tspan
              class="ltr"
            >s</tspan><tspan class="ltr">h</tspan></text>
          <text id="name-2" class="script" x="200.3" y="235" text-anchor="middle"><tspan
              class="ltr"
            >B</tspan><tspan class="ltr">h</tspan><tspan class="ltr">a</tspan><tspan
              class="ltr"
            >r</tspan><tspan class="ltr">t</tspan><tspan class="ltr">i</tspan></text>
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The source card types each name on one letter every 2 frames @30fps,
      // with the lower line starting 2 frames after the upper one. The new
      // names pick up the same frames so the pair stays in lockstep.
      const FPS = 30;
      const FRAMES_PER_LETTER = 2;
      const FIRST_FRAME = { "#name-1": 390, "#name-2": 392 };

      // Each set is placed half a frame early, in the gap before its target
      // frame. Landing one exactly on a frame time makes it a float-equality
      // coin toss, which showed up as every letter appearing one frame late.
      Object.entries(FIRST_FRAME).forEach(([sel, first]) => {
        gsap.utils.toArray(sel + " .ltr").forEach((el, i) => {
          const frame = first + i * FRAMES_PER_LETTER;
          tl.set(el, { opacity: 1 }, (2 * frame - 1) / (2 * FPS));
        });
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
